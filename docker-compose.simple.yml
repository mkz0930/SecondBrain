# 简化版 Docker Compose 配置
# 不使用 Nginx，直接暴露应用端口
# 适合快速部署和测试

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: second-brain
    restart: unless-stopped
    ports:
      - "80:3000"    # HTTP
      - "443:3000"   # HTTPS（如果应用支持）
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DISABLE_ANON=${DISABLE_ANON:-false}
      - FEISHU_SYNC_ENABLED=${FEISHU_SYNC_ENABLED:-true}
      - DB_PATH=/app/data/brain.db
    volumes:
      # 持久化数据库
      - ./data:/app/data
      # 持久化日志
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
