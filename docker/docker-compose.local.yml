version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: second-brain-local
    restart: unless-stopped
    ports:
      - "8080:3000"    # 使用 8080 端口避免与开发服务器冲突
    env_file:
      - .env.local
    volumes:
      # 持久化数据库
      - ./data:/app/data
      # 持久化日志
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
